<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <!-- Background -->
  <rect id="background" width="600" height="400" fill="#f0f4ff" rx="12"/>

  <!-- Dashboard Panel -->
  <g id="dashboard-panel">
    <rect id="panel-bg" x="30" y="30" width="540" height="340" rx="12" fill="#ffffff" stroke="#e2e5ea" stroke-width="1"/>

    <!-- Header -->
    <g id="header-section">
      <rect id="header-bg" x="30" y="30" width="540" height="60" rx="12" fill="#4f6ef7"/>
      <rect x="30" y="70" width="540" height="20" fill="#4f6ef7"/>
      <text id="header-title" x="60" y="68" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">Analytics Dashboard</text>
    </g>

    <!-- Stats Cards -->
    <g id="stats-section">
      <g id="card-users">
        <rect x="50" y="110" width="150" height="80" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
        <text x="125" y="142" font-family="Arial, sans-serif" font-size="11" fill="#6366f1" text-anchor="middle">USERS</text>
        <text x="125" y="170" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#4338ca" text-anchor="middle">12,847</text>
      </g>

      <g id="card-revenue">
        <rect x="225" y="110" width="150" height="80" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
        <text x="300" y="142" font-family="Arial, sans-serif" font-size="11" fill="#22c55e" text-anchor="middle">REVENUE</text>
        <text x="300" y="170" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#15803d" text-anchor="middle">$94,521</text>
      </g>

      <g id="card-orders">
        <rect x="400" y="110" width="150" height="80" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
        <text x="475" y="142" font-family="Arial, sans-serif" font-size="11" fill="#f59e0b" text-anchor="middle">ORDERS</text>
        <text x="475" y="170" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#b45309" text-anchor="middle">3,461</text>
      </g>
    </g>

    <!-- Chart Area -->
    <g id="chart-section">
      <rect id="chart-bg" x="50" y="210" width="320" height="140" rx="8" fill="#fafbfd" stroke="#e2e5ea" stroke-width="1"/>
      <text x="70" y="235" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1a1d23">Monthly Trend</text>

      <!-- Simple bar chart -->
      <g id="chart-bars">
        <rect x="80" y="280" width="25" height="50" rx="3" fill="#4f6ef7" opacity="0.7"/>
        <rect x="115" y="265" width="25" height="65" rx="3" fill="#4f6ef7" opacity="0.8"/>
        <rect x="150" y="275" width="25" height="55" rx="3" fill="#4f6ef7" opacity="0.75"/>
        <rect x="185" y="255" width="25" height="75" rx="3" fill="#4f6ef7" opacity="0.85"/>
        <rect x="220" y="260" width="25" height="70" rx="3" fill="#4f6ef7" opacity="0.8"/>
        <rect x="255" y="245" width="25" height="85" rx="3" fill="#4f6ef7" opacity="0.9"/>
        <rect x="290" y="250" width="25" height="80" rx="3" fill="#22c55e"/>
        <rect x="325" y="270" width="25" height="60" rx="3" fill="#4f6ef7" opacity="0.6"/>
      </g>
    </g>

    <!-- Tooltip (hidden by default - interaction target) -->
    <g id="tooltip-users">
      <rect x="50" y="85" width="160" height="35" rx="6" fill="#1a1d23" opacity="0.95"/>
      <text x="130" y="107" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">+15% vs last month</text>
    </g>

    <g id="tooltip-revenue">
      <rect x="225" y="85" width="160" height="35" rx="6" fill="#1a1d23" opacity="0.95"/>
      <text x="305" y="107" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">+23% vs last month</text>
    </g>

    <g id="tooltip-orders">
      <rect x="400" y="85" width="160" height="35" rx="6" fill="#1a1d23" opacity="0.95"/>
      <text x="480" y="107" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">-5% vs last month</text>
    </g>

    <!-- Side panel (hidden by default - interaction target) -->
    <g id="detail-panel">
      <rect x="390" y="210" width="170" height="140" rx="8" fill="white" stroke="#e2e5ea" stroke-width="1"/>
      <text x="475" y="237" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1a1d23" text-anchor="middle">Chart Details</text>
      <text x="410" y="260" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">Peak: June</text>
      <text x="410" y="280" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">Avg: $11,815</text>
      <text x="410" y="300" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">Growth: +18.5%</text>
      <text x="410" y="320" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">Forecast: ↑</text>
    </g>
  </g>
</svg>
